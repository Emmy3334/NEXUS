[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "NEXUS — The Self-Healing Cloud Shell"
license = "LicenseRef-Proprietary"
publish = false
# One integration crate so rust-analyzer sees a single module tree.
autotests = false

[lib]
name = "nexus"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/bin/nexus.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
bollard = "0.18"
futures-util = "0.3"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4", default-features = false, features = [
    "client",
    "rustls-tls",
    "ring",
    "http-proxy",
    "ws",
] }
nix = { version = "0.29", default-features = false, features = ["fs", "process", "signal", "term", "resource"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Patched line for RUSTSEC-2026-0086..0096 (sandbox escapes on 24.x).
wasmtime = { version = "36.0.7", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = "36.0.7"
wat = "1"

# Harden release binaries: smaller surface, no panic unwind tables, stripped symbols.
# Prefer speed (`opt-level = 3`) over extreme size (`"z"`) for an interactive shell.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
